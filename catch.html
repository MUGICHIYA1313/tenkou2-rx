<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>てんこう2 パケットキャッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<style>
:root{
  --bg:#07041a; --ink:#140a24; --text:#ffffff; --dim:#a596c8; --accent:#ffcf3a; --pkt:#4fe8ff; --warn:#ff4f6a; --ok:#6dffb0; --pink:#ff6fb5;
  --dot:"DotGothic16",system-ui,sans-serif; --num:"Press Start 2P",ui-monospace,monospace;
  --frame:0 0 0 3px var(--ink),0 0 0 6px var(--pink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--dot);text-shadow:1px 0 0 currentColor,2px 2px 0 #140a24,-1px -1px 0 #140a24,2px -1px 0 #140a24,-1px 2px 0 #140a24;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#sky,#ui{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{pointer-events:none}
.panel{background:rgba(14,7,36,.86);box-shadow:var(--frame)}
#top{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;padding:10px 12px;pointer-events:none;display:none}
#top .r{display:flex;justify-content:space-between;align-items:center}
#hearts{font-size:24px;color:var(--warn);letter-spacing:1px;text-shadow:2px 2px 0 var(--ink)}
#score{font-family:var(--num);font-size:18px;display:inline-block;text-shadow:2px 2px 0 var(--ink)}
#score.bump{animation:bump .25s steps(3)}
@keyframes bump{50%{transform:scale(1.3);color:var(--pkt)}}
#timebar{height:10px;background:#2a1650;margin-top:8px;box-shadow:0 0 0 2px var(--ink)}
#timefill{height:100%;width:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,#ff9a3a 8px 10px);transform-origin:left}
#sub{font-size:11px;color:var(--dim);margin-top:6px;text-align:center}
#pic{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);padding:8px 8px 6px;text-align:center;display:none;pointer-events:none}
#picCanvas{width:120px;height:120px;display:block;image-rendering:pixelated}
#picLabel{font-size:12px;margin-top:5px;color:var(--pkt)}
#bits{font-family:var(--num);font-size:7px;margin-top:4px;white-space:nowrap;overflow:hidden;width:120px;line-height:1.4}
#camBtn{position:fixed;right:16px;top:calc(env(safe-area-inset-top) + 120px);width:44px;height:44px;padding:0;font-size:20px;display:none;z-index:5}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--dot);font-size:min(38px,8.4vw);padding:0 10px;color:#fff;text-shadow:2px 0 0 #fff,5px 5px 0 var(--ink),-3px -3px 0 var(--ink),4px -3px 0 var(--ink),-3px 4px 0 var(--ink),0 0 18px rgba(255,111,181,.6);pointer-events:none;opacity:0}
#banner.on{opacity:1;animation:pop .2s steps(2)}
@keyframes pop{from{transform:scale(.6)}}
#banner small{display:block;font-size:15px;color:var(--text);margin-top:8px;line-height:1.5}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;z-index:10}
#start{background:linear-gradient(rgba(7,4,26,.15),rgba(7,4,26,.7) 60%)}
#start h1{font-weight:400;font-size:min(42px,10.5vw);white-space:nowrap;line-height:1.15;color:var(--ok);text-shadow:4px 4px 0 var(--ink),0 0 20px rgba(109,255,176,.55);letter-spacing:.04em}
#start h1 span{color:var(--accent);text-shadow:4px 4px 0 var(--ink),0 0 20px rgba(255,207,58,.5)}
.steps{display:flex;flex-direction:column;gap:12px;text-align:left;max-width:330px}
.steps div{display:flex;gap:12px;align-items:center;font-size:15px;line-height:1.45;text-shadow:2px 2px 0 var(--ink)}
.steps i{font-style:normal;flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:19px;background:rgba(14,7,36,.86);box-shadow:0 0 0 3px var(--ink),0 0 0 5px var(--pink)}
.steps b{font-weight:400}
.note{font-size:11px;color:var(--dim);text-shadow:2px 2px 0 var(--ink)}
button{font-family:var(--dot);font-size:18px;color:var(--text);background:#3a1f6a;border:none;border-radius:0;padding:14px;width:260px;cursor:pointer;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.18),0 0 0 3px var(--ink)}
button.primary{background:var(--accent);color:#2a0f1a}
button:active{transform:translate(2px,2px)}
#live{font-size:12px;line-height:1.75;max-width:330px;padding:8px 12px;background:rgba(14,7,36,.86);box-shadow:var(--frame)}
#live b{color:var(--accent);font-weight:400}
#result{display:none;background:rgba(7,4,26,.82);gap:10px;overflow-y:auto;justify-content:flex-start;padding-top:calc(env(safe-area-inset-top) + 22px);padding-bottom:30px}
#rTitle{font-size:min(32px,8vw);white-space:nowrap;color:var(--accent);text-shadow:4px 4px 0 var(--ink),0 0 18px rgba(255,207,58,.5)}
#rImg{width:288px;height:144px;image-rendering:pixelated;box-shadow:var(--frame)}
#rPieces{font-size:14px;color:var(--pkt);margin-top:6px}
#rScore{font-family:var(--num);font-size:34px;line-height:1.2;text-shadow:4px 4px 0 var(--ink)}
#rSub{font-size:12px;color:var(--dim)}
#report{display:flex;flex-direction:column;gap:6px;width:300px;font-size:12px}
#report .row{display:flex;align-items:center;gap:8px}
#report .nm{width:104px;text-align:left}
#report .bar{flex:1;height:10px;background:#2a1650;box-shadow:0 0 0 2px var(--ink)}
#report .bar i{display:block;height:100%}
#report .ct{width:48px;text-align:right;font-family:var(--num);font-size:9px}
#rLearn{font-size:12px;line-height:1.75;max-width:320px;padding:10px 12px;text-align:left;background:rgba(14,7,36,.9);box-shadow:var(--frame)}
#rLearn b{color:var(--ok);font-weight:400;font-size:14px}
#msg{position:fixed;left:50%;top:68%;transform:translate(-50%,-50%);font-size:14px;padding:10px 16px;background:rgba(14,7,36,.92);box-shadow:var(--frame);display:none;z-index:20;text-align:center;max-width:85%;line-height:1.6}
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="sky"></canvas>
<canvas id="ui"></canvas>
<button id="camBtn" title="カメラ映像">📷</button>

<div id="top" class="panel">
  <div class="r"><span id="hearts">♥♥♥</span><span id="score">0</span></div>
  <div id="timebar"><div id="timefill"></div></div>
  <div id="sub"></div>
</div>
<div id="pic" class="panel"><canvas id="picCanvas" width="96" height="96"></canvas><div id="picLabel">0 / 25 ピース</div><div id="bits"></div></div>
<div id="banner"></div>

<div id="start" class="screen">
  <h1><span>てんこう2</span><br>パケットキャッチ</h1>
  <div class="steps">
    <div><i>🛰</i><span><b style="color:var(--accent)">本物のてんこう2の軌道</b>で<br>相模原の空を通るパスを再現！</span></div>
    <div><i>🪐</i><span>パケットを集めて<b style="color:var(--pkt)">日芸8学科の星</b>の<br>絵を完成させ、地球に帰ろう</span></div>
    <div><i>☄️</i><span><b style="color:var(--warn)">デブリ</b>はライフ−1、<br><b style="color:var(--ok)">宇宙人</b>は一発アウト！</span></div>
    <div><i>💗</i><span>ごくまれに出る<b style="color:#ff6f8a">ハートの電波</b>で<br>ライフが1つ回復</span></div>
  </div>
  <div id="live">本物のてんこう2を計算中…</div>
  <button class="primary" id="bStartAR">スマホでスタート</button>
  <button id="bStartPC">PCであそぶ</button>
  <p class="note">スマホを持って、体ごと振り向いて遊ぶゲームです</p>
</div>

<div id="result" class="screen">
  <div id="rTitle">完成！</div><div style="font-size:12px;color:var(--dim);margin-top:-4px;text-shadow:2px 2px 0 var(--ink)">てんこう2 ミッションレポート</div>
  <canvas id="rImg" width="384" height="192"></canvas>
  <div id="rPieces"></div>
  <div id="report"></div>
  <div id="rScore">0</div>
  <div id="rSub"></div>
  <div id="rLearn"></div>
  <button class="primary" id="bAgain">もう一度あそぶ</button>
</div>
<div id="msg"></div>

<script>
"use strict";
// ================== 調整用の数値 ==================
const STAGE_SEC = 40;       // 1ステージの制限時間（秒）
const RUN_SEC = STAGE_SEC*8; // 衛星のパスを割り当てる全体の長さ
const GRID = 3;             // 各学科の絵のピース 3×3=9
const ALIEN_R = 5;          // 宇宙人の当たり判定（度）
const CATCH_R = 5.5;          // キャッチ判定（度）
const ROCK_R = 4.5;         // デブリ当たり判定（度）
const SAT_SWING = 25;       // 衛星が左右に動く幅（度）

// ================== 本物のてんこう2 ==================
// CelesTrak から取得した軌道データ（NORAD 68261）。ページを開いた時に最新版の取得も試みる
let TLE=["TEN-KOH 2",
 "1 68261U 25241B   26309.33270499  .00004682  00000+0  19562-3 0  9999",
 "2 68261  51.6595   7.0436 0005815 274.4137  85.6177 15.25479161 36445"];
let TLE_NOTE="2026年11月5日の軌道データ";
const OBS={lat:35.5582, lon:139.3956, h:0.15};   // JAXA相模原キャンパス
const TYPES=[
 {k:"art",   icon:"🎨", rgb:"79,232,255",  name:"日芸の作品",   bits:"00", f:523, w:.5},
 {k:"photo", icon:"📷", rgb:"255,216,79",  name:"地球の写真",   bits:"01", f:659, w:.2},
 {k:"rad",   icon:"☢️", rgb:"197,140,255", name:"放射線データ", bits:"10", f:784, w:.15},
 {k:"radio", icon:"📻", rgb:"125,255,138", name:"無線家の声",   bits:"11", f:988, w:.15}];
const HEAL={k:"heal", icon:"💗", rgb:"255,111,138", name:"ライフ回復", bits:"♥", f:1175, w:0};
const DEPTS=[
 {name:"写真学科",     c:["#ffe08a","#e29a2a","#5a2a12"], icon:"camera"},
 {name:"映画学科",     c:["#ff9a9a","#d43a4a","#4a1220"], icon:"film"},
 {name:"美術学科",     c:["#ffb3e0","#d45aa8","#4a1a56"], icon:"palette"},
 {name:"音楽学科",     c:["#9ff0ff","#3a8fd0","#142a5e"], icon:"note"},
 {name:"文芸学科",     c:["#eeeef8","#9a9ab8","#3a3a5a"], icon:"book"},
 {name:"演劇学科",     c:["#d6a8ff","#7a3ad0","#26124e"], icon:"mask"},
 {name:"放送学科",     c:["#ffc27a","#e2553a","#5a1622"], icon:"mic"},
 {name:"デザイン学科", c:["#c9ff9a","#5fbf6a","#1e5232"], icon:"pencil"}];
const COUNTRIES=["🇺🇸 アメリカ","🇬🇧 イギリス","🇧🇷 ブラジル","🇦🇺 オーストラリア","🇹🇼 台湾","🇩🇪 ドイツ","🇮🇳 インド","🇿🇦 南アフリカ","🇨🇦 カナダ","🇫🇷 フランス","🇰🇷 韓国","🇦🇷 アルゼンチン"];

// ================== 共通 ==================
const DEG=Math.PI/180, $=id=>document.getElementById(id);
const enu=(az,el)=>[Math.cos(el*DEG)*Math.sin(az*DEG), Math.cos(el*DEG)*Math.cos(az*DEG), Math.sin(el*DEG)];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const n=Math.hypot(...a)||1;return a.map(v=>v/n)};
const add=(a,b,k)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
const ang=(a,b)=>Math.acos(Math.max(-1,Math.min(1,dot(a,b))))/DEG;
const vecAz=v=>(Math.atan2(v[0],v[1])/DEG+360)%360;
const vecEl=v=>Math.asin(Math.max(-1,Math.min(1,v[2])))/DEG;
const rnd=(a,b)=>a+Math.random()*(b-a);
const DIRS=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const dirName=a=>DIRS[Math.round((((a%360)+360)%360)/22.5)%16];
const wrap180=a=>((a+540)%360)-180;
let REC=null;
function loadRec(){ try{ if(typeof satellite!=="undefined") REC=satellite.twoline2satrec(TLE[1],TLE[2]); }catch(e){ REC=null; } }
loadRec();
function lookAt(t){
  if(!REC) return null; const d=new Date(t), pv=satellite.propagate(REC,d); if(!pv||!pv.position) return null;
  const g=satellite.gstime(d), gd={latitude:OBS.lat*DEG,longitude:OBS.lon*DEG,height:OBS.h};
  const l=satellite.ecfToLookAngles(gd,satellite.eciToEcf(pv.position,g)), geo=satellite.eciToGeodetic(pv.position,g);
  return {t, az:l.azimuth/DEG, el:l.elevation/DEG, rng:l.rangeSat, alt:geo.height};
}
function nextPass(from,minMax,maxMax){
  // いま上空を通過中なら、そのパスは飛ばして次から探す
  for(let k=0;k<120;k++){ const l=lookAt(from); if(!l) return null; if(l.el<=0) break; from+=10000; }
  let inP=false, st=0, mx=null, rise=null;
  for(let s=0;s<60*3600;s+=20){ const t=from+s*1000, l=lookAt(t); if(!l) return null;
    if(l.el>0&&!inP){ inP=true; st=t; mx=l; rise=l; }
    if(inP&&l.el>mx.el) mx=l;
    if(l.el<=0&&inP){ inP=false; if(mx.el>=minMax && mx.el<=(maxMax||91)) return {aos:st, los:t, max:mx, rise, set:l}; } }
  return null;
}
const fmtJST=t=>new Date(t).toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"});
function passText(p){ return `<b>${fmtJST(p.aos)}</b>ごろ・最高 ${p.max.el.toFixed(0)}°${p.max.el>=80?"（ほぼ真上！）":""}・${dirName(p.rise.az)}から${dirName(p.set.az)}へ`; }
let GP=null;   // ゲームで再現するパス
function prepPass(){
  if(!REC){ GP=null; return; }
  const p=nextPass(Date.now(),25,70)||nextPass(Date.now(),12); if(!p){ GP=null; return; }
  let gs=p.aos, ge=p.los; for(let t=p.aos;t<p.los;t+=2000){ if(lookAt(t).el>=8){ gs=t; break; } } for(let t=p.los;t>p.aos;t-=2000){ if(lookAt(t).el>=8){ ge=t; break; } }
  GP={...p, gs, ge};
}
function updateLive(){
  const el=$("live"); if(!el) return;
  if(!REC){ el.innerHTML="軌道計算ライブラリを読み込めませんでした（架空の軌道で遊べます）"; return; }
  const n=lookAt(Date.now()), np=nextPass(Date.now(),30);
  el.innerHTML=`いまの<b>てんこう2</b>：高度 ${Math.round(n.alt)}km・相模原から ${Math.round(n.rng).toLocaleString()}km（${n.el>0?"相模原の空の上！":"地平線の下"}）`+
    (np?`<br>相模原の空に次に高く昇るのは<br>${passText(np)}`:"")+`<br><span style="color:var(--dim);font-size:10px">${TLE_NOTE}</span>`;
}
(async()=>{ try{ const c=new AbortController(); setTimeout(()=>c.abort(),4000);
  const r=await fetch("https://celestrak.org/NORAD/elements/gp.php?CATNR=68261&FORMAT=TLE",{signal:c.signal}); const t=(await r.text()).trim().split(/\r?\n/).map(s=>s.trim());
  if(t.length>=3 && t[1].startsWith("1 68261") && t[2].startsWith("2 68261")){ TLE=t; TLE_NOTE="最新の軌道データ（CelesTrak）"; loadRec(); }
 }catch(e){} updateLive(); })();
setInterval(()=>{ if($("start").style.display!=="none") updateLive(); },2000);
function toast(t,ms){ const m=$("msg"); m.innerHTML=t; m.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>m.style.display="none",ms||2500); }

// ================== 向き ==================
let mode=null, ori=null, compass=null, view={az:0,el:15}, vfov=62;
function basisFromView(az,el){ const f=enu(az,el); let r=norm(cross(f,[0,0,1])); if(!isFinite(r[0])) r=[1,0,0]; return {f,u:norm(cross(r,f)),r}; }
function basisFromOri(o){
  const a=(o.alpha||0)*DEG,b=(o.beta||0)*DEG,g=(o.gamma||0)*DEG;
  const ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b),cg=Math.cos(g),sg=Math.sin(g);
  const R=[[ca*cg-sa*sb*sg,-cb*sa,ca*sg+cg*sa*sb],[cg*sa+ca*sb*sg,ca*cb,sa*sg-ca*cg*sb],[-cb*sg,sb,cb*cg]];
  const col=i=>[R[0][i],R[1][i],R[2][i]];
  const r=col(0),u=col(1),f=col(2).map(v=>-v);
  const th=((screen.orientation&&screen.orientation.angle)||window.orientation||0)*DEG;
  return {f, u:u.map((v,i)=>Math.cos(th)*v+Math.sin(th)*r[i]), r:r.map((v,i)=>Math.cos(th)*v-Math.sin(th)*u[i])};
}
function getBasis(){ return (mode==="ar"&&ori)?basisFromOri(ori):basisFromView(view.az,view.el); }

// ================== 描画の準備（ドット絵） ==================
const P=3;                                   // 1ドット = 3px
const cv=$("sky"), px=cv.getContext("2d"), tcv=$("ui"), tx=tcv.getContext("2d"); let W=0,H=0,DPR=1, camOn=false;
function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(2,devicePixelRatio||1);
  cv.width=Math.ceil(W/P); cv.height=Math.ceil(H/P); px.setTransform(1/P,0,0,1/P,0,0); px.imageSmoothingEnabled=false;
  tcv.width=W*DPR; tcv.height=H*DPR; tx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();
const snap=v=>Math.round(v/P)*P;
function project(v,B){ const z=dot(v,B.f), f=(H/2)/Math.tan(vfov*DEG/2); return {x:W/2+dot(v,B.r)/z*f, y:H/2-dot(v,B.u)/z*f, front:z>0.05, rx:dot(v,B.r), ry:dot(v,B.u)}; }
const degPx=()=> (H/2)/Math.tan(vfov*DEG/2)*DEG;
function sprite(rows,pal){ const hh=rows.length, ww=rows[0].length, c=document.createElement("canvas"); c.width=ww; c.height=hh; const g=c.getContext("2d");
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(pal[ch]){ g.fillStyle=pal[ch]; g.fillRect(x,y,1,1); } })); return c; }
function blit(spr,x,y,s){ s=s||1; const w=spr.width*P*s, hh=spr.height*P*s; px.drawImage(spr,snap(x-w/2),snap(y-hh/2),w,hh); }
function dotRect(x,y,w,hh,c){ px.fillStyle=c; px.fillRect(snap(x),snap(y),Math.max(P,snap(w)),Math.max(P,snap(hh))); }
function label(text,x,y,color,size){ tx.font=`${size||13}px "DotGothic16",sans-serif`; tx.textAlign="center"; tx.lineJoin="round";
  x=Math.round(x); y=Math.round(y); tx.lineWidth=6; tx.strokeStyle="#140a24"; tx.strokeText(text,x,y); tx.strokeText(text,x+1,y);
  tx.fillStyle=color; tx.fillText(text,x,y); tx.fillText(text,x+1,y); }

// --- ドット絵スプライト（このゲームのためのオリジナル） ---
const SAT_SPR=sprite([
 "bbbbb..kkkk..bbbbb",
 "bBbBb..gYYg..bBbBb",
 "bbbbbwwgYYgwwbbbbb",
 "bBbBb..gyyg..bBbBb",
 "bbbbb..kkkk..bbbbb",
 ".......w..w.......",
 ".......c..c......."],{b:"#2b4fa8",B:"#6d9bff",k:"#8a6a2a",g:"#d8b14e",Y:"#fff1a8",y:"#e8c86a",w:"#d6dcf0",c:"#4fe8ff"});
const ROCK_SPR=sprite([
 "...dddd...",
 "..drrRrd..",
 ".drRRrrrd.",
 "drrRrrrsrd",
 "drrrrsrrrd",
 "dsrrrrrRrd",
 ".drrRrrrd.",
 "..drrrrd..",

      banner(`ステージ${G.stage+1}/8<small>${DEPTS[G.stage].name}の星</small>`,1500); sfx.count(true); }
    return; }

    const f=Math.min(1,k.age/k.fly), e=1-Math.pow(1-f,3); k.pos=norm(add(k.from,[k.to[0]-k.from[0],k.to[1]-k.from[1],k.to[2]-k.from[2]],e));
    if(f>.35 && ang(k.pos,B.f)<CATCH_R){
      G.packets.splice(i,1); G.combo++; G.maxCombo=Math.max(G.maxCombo,G.combo); G.caught++;
      const T=k.ty; G.got[T.k]++; G.bits.push(T); if(G.bits.length>10) G.bits.shift();
      if(T===HEAL){ G.life=Math.min(3,G.life+1); const p=project(k.pos,B); burst(p.x,p.y,T.rgb,24); floatText(p.x,p.y-14,"♥ ライフ回復！","#ff6f8a"); banner("ライフ回復！",900); sfx.heal(); buzz([30,30,30]); continue; }
      const pts=(100+G.combo*20)*(1+G.stage*.25)|0; G.score+=pts;
      const p=project(k.pos,B); burst(p.x,p.y,T.rgb,16); floatText(p.x,p.y-14,"+"+pts+"  "+T.bits,`rgb(${T.rgb})`);
      if(T.k==="photo") floatText(p.x,p.y+16,"📷 地球の写真","#ffd84f");
      if(T.k==="rad") floatText(p.x,p.y+16,"☢️ 放射線を観測","#c58cff");
      if(T.k==="radio") floatText(p.x,p.y+16,COUNTRIES[Math.random()*COUNTRIES.length|0]+"から","#7dff8a");
      sfx.catch(G.combo,T.f); buzz(15); const sc=$("score"); sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump");
      if(T.k==="art" && revealTile()>=0 && G.tiles.every(Boolean)){ stageClear(); return; }
      continue;
    }
    if(k.age>k.fly+k.life){ G.packets.splice(i,1); if(k.ty===HEAL) continue; if(G.combo>=3) floatText(W/2,H/2+64,"コンボ切れ","#8a97ab"); G.combo=0; sfx.miss(); }
  }
  // デブリ
  for(let i=G.rocks.length-1;i>=0;i--){
    const r=G.rocks[i]; r.age+=dt; r.spin+=dt*2;
    r.v=norm(add(r.v,r.p,-dot(r.v,r.p))); r.p=norm(add(r.p,r.v,r.speed*DEG*dt));
    if(r.age>.7 && G.inv<=0 && ang(r.p,B.f)<ROCK_R){
      G.rocks.splice(i,1); G.life--; G.combo=0; G.shake=.45; G.flash=.5; G.inv=1.2; sfx.hit(); buzz(250);
      const p=project(r.p,B); burst(p.x,p.y,"255,110,60",26);
      if(G.life<=0){ end("大破…"); return; }
      banner("デブリ衝突！",900); continue;
    }
    if(r.age>r.life) G.rocks.splice(i,1);
  }
  // 宇宙人（一発アウト）
  for(let i=G.aliens.length-1;i>=0;i--){
    const a=G.aliens[i]; a.age+=dt;
    if(a.age<a.warn){ if(Math.floor(a.age*6)!==Math.floor((a.age-dt)*6)) sfx.warn(); continue; }
    const up=norm(cross(a.v,a.p)); a.v=norm(add(a.v,up,Math.sin(a.age*2.4+a.ph)*.05)); a.v=norm(add(a.v,a.p,-dot(a.v,a.p))); a.p=norm(add(a.p,a.v,a.speed*DEG*dt));
    if(ang(a.p,B.f)<ALIEN_R){ G.life=0; G.shake=.8; G.flash=1; sfx.alien(); buzz([300,80,300]); const p=project(a.p,B); burst(p.x,p.y,"125,255,138",40); end("宇宙人につかまった…"); return; }
    if(a.age>a.warn+a.life) G.aliens.splice(i,1);
  }
  if(G.stageT>=STAGE_SEC) end("タイムアップ");
}

    $("report").innerHTML=TYPES.map(T=>{ const s=G.sent[T.k]||0, gg=G.got[T.k]||0, pc=s?Math.round(gg/s*100):0;
      return `<div class="row"><span class="nm">${T.icon} ${T.name}</span><span class="bar"><i style="width:${pc}%;background:rgb(${T.rgb})"></i></span><span class="ct">${pc}%</span></div>`; }).join("");
    $("rScore").textContent=G.score.toLocaleString();

    $("result").style.display="flex"; $("top").style.display="none"; $("pic").style.display="none"; $("result").scrollTop=0;

// ================== 描画 ==================
function arrowTo(v,B,color,text){
  const p=project(v,B); if(p.front && p.x>16&&p.x<W-16&&p.y>120&&p.y<H-190) return;
  const a=Math.atan2(-p.ry,p.rx), mx=W/2-34, my=H/2-150, c=Math.cos(a), s=Math.sin(a), k=Math.min(Math.abs(mx/(c||1e-6)),Math.abs(my/(s||1e-6)));
  const x=W/2+c*k, y=H/2+s*k;
  px.save(); px.translate(snap(x),snap(y)); px.rotate(Math.round(a/(Math.PI/4))*(Math.PI/4)); px.fillStyle=color;
  px.beginPath(); px.moveTo(15,0); px.lineTo(-9,-12); px.lineTo(-9,12); px.closePath(); px.fill(); px.restore();
  if(text) label(text,x-c*30,y-s*30+4,color,12);
}
function draw(B,now){
  tx.clearRect(0,0,W,H);
  const sh=G&&G.shake>0?[snap(rnd(-1,1)*G.shake*24),snap(rnd(-1,1)*G.shake*24)]:[0,0];
  px.save(); tx.save(); px.translate(sh[0],sh[1]); tx.translate(sh[0],sh[1]);
  drawWorld(B,now);
  if(G && G.state!=="count"){
    const s=satDir(), sp=project(s,B);
    if(G.azOff!==null){ for(let a=0;a<360;a+=45){ const q=project(enu(a-G.azOff,-3),B); if(q.front&&q.x>-20&&q.x<W+20) label(DIRS[a/22.5],q.x,q.y+14,"#ffcf3a",a%90?11:15); } }
    // てんこう2
    if(sp.front){ const blink=Math.floor(now/250)%3;
      px.strokeStyle="rgba(79,232,255,.8)"; px.lineWidth=P; for(let i=0;i<=blink;i++){ const r=snap(44+i*14); px.strokeRect(snap(sp.x)-r,snap(sp.y)-r,r*2,r*2); }
      blit(SAT_SPR,sp.x,sp.y,2); label("てんこう2",sp.x,sp.y-30,"#ffcf3a",14); }
    // 宇宙人
    for(const a of G.aliens){ const p=project(a.p,B); if(!p.front) continue;
      const warn=a.age<a.warn, blinkOn=Math.floor(now/(warn?110:200))%2;
      if(warn && !blinkOn) { label("！",p.x,p.y+8,"#ff4f6a",30); continue; }
      blit(UFO[blinkOn],p.x,p.y,2);
      label(warn?"キケン！":"即死！",p.x,p.y-30,"#ff4f6a",warn?16:13);
      if(ang(a.p,B.f)<ALIEN_R*2.4 && blinkOn){ px.strokeStyle="#ff4f6a"; px.lineWidth=P*2; const q=snap(ALIEN_R*degPx()); px.strokeRect(snap(p.x)-q,snap(p.y)-q,q*2,q*2); } }
    // デブリ
    const FL=["#fff3a0","#ffd84f","#ffb13b","#ff7a3d","#e2453a","#8a2a4a"];
    for(const r of G.rocks){ const p=project(r.p,B); if(!p.front) continue;
      const on=r.age>.7||Math.floor(now/120)%2, sc=r.sz>1.1?2:1; if(!on) continue;
      const tv=project(norm(add(r.p,r.v,-.05)),B); let dx=tv.x-p.x, dy=tv.y-p.y; const dl=Math.hypot(dx,dy)||1; dx/=dl; dy/=dl;
      for(let i=FL.length-1;i>=0;i--){ const d=(10+i*7)*sc, w=(14-i*1.6)*sc; dotRect(p.x+dx*d-w/2,p.y+dy*d-w/2,w,w,FL[i]); }
      blit(ROCK_SPR,p.x,p.y,sc);
      if(ang(r.p,B.f)<ROCK_R*2.2 && Math.floor(now/150)%2){ px.strokeStyle="#ff4f6a"; px.lineWidth=P; const q=snap(ROCK_R*degPx()); px.strokeRect(snap(p.x)-q,snap(p.y)-q,q*2,q*2); } }
    // パケット
    for(const k of G.packets){ if(!k.pos) continue; const p=project(k.pos,B); if(!p.front) continue;
      const T=k.ty; T.spr=T.spr||packetSprite(T); const f=Math.min(1,k.age/k.fly), rem=Math.max(0,1-(k.age-k.fly)/k.life);
      if(f<1){ const q=project(k.from,B); if(q.front){ for(let i=1;i<6;i++){ const t=i/6; dotRect(q.x+(p.x-q.x)*t,q.y+(p.y-q.y)*t,P,P,`rgba(${T.rgb},.6)`); } } }
      if(f>=1 && rem<.3 && Math.floor(now/90)%2) continue;
      const bob=f>=1?snap(Math.sin(now/200+k.from[0]*9)*3):0;
      dotRect(p.x-24,p.y-24+bob,48,48,`rgba(${T.rgb},.25)`);
      dotRect(p.x-20,p.y-20+bob,40,40,"#ffffff");
      blit(T.spr,p.x,p.y+bob,1);
      if(f>=1){ dotRect(p.x-16,p.y+22+bob,33,P*2,"#140a24"); dotRect(p.x-16,p.y+22+bob,33*rem,P*2,rem<.35?"#ff4f6a":`rgb(${T.rgb})`); } }
    for(const k of G.packets){ if(k.pos && k.age>k.fly*.5) arrowTo(k.pos,B,`rgb(${k.ty.rgb})`); }
    arrowTo(s,B,"#ffcf3a","てんこう2");
  }
  // ワープ演出
  if(G && G.state==="warp"){ const k=Math.max(0,1-G.warp/2.6);
    for(let i=0;i<70;i++){ const a=i*2.399, r0=((i*97)%100)/100, r=((r0+now/700*(1+k*3))%1)*Math.max(W,H)*.8, len=20+k*120;
      const c=Math.cos(a), s=Math.sin(a); for(let j=0;j<len;j+=P*2) dotRect(W/2+c*(r+j),H/2+s*(r+j),P,P,["#ffffff","#9ff0ff","#ffb3e0"][i%3]); } }
  // 照準（ドットのカギ形）
  if(G && G.state!=="end" && G.state!=="warp"){
  const R=snap(CATCH_R*degPx()), cx0=snap(W/2), cy0=snap(H/2), L=snap(R*.45);
  const hot=G&&G.packets.some(k=>k.pos&&ang(k.pos,B.f)<CATCH_R*1.8), col=hot?"#4fe8ff":"#f4eeff";
  for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ const x=cx0+sx*R, y=cy0+sy*R;
    dotRect(sx<0?x:x-L,y-(sy<0?0:P),L,P,"#140a24"); dotRect(x-(sx<0?0:P),sy<0?y:y-L,P,L,"#140a24");
    dotRect(sx<0?x:x-L+P,y-(sy<0?0:P)-P,L,P,col); dotRect(x-(sx<0?0:P)-P,sy<0?y-P:y-L,P,L,col); }
  dotRect(cx0-P,cy0-P,P*2,P*2,col);
  if(G&&G.combo>=2) label(G.combo+" コンボ!",W/2,H/2+R+32,"#4fe8ff",20);
  }
  if(G){ for(const p of G.parts) dotRect(p.x,p.y,P*2,P*2,`rgba(${p.c},${Math.min(1,p.t*2)})`);
    for(const f of G.floats){ tx.globalAlpha=Math.min(1,f.t*2); label(f.text,f.x,f.y,f.color,16); tx.globalAlpha=1; }
    if(G.flash>0&&Math.floor(now/60)%2){ px.fillStyle=`rgba(255,40,80,${G.flash*.6})`; px.fillRect(-60,-60,W+120,H+120); } }
  px.restore(); tx.restore();
}
function updateHUD(){
  if(!G) return;
  $("hearts").textContent="♥".repeat(Math.max(0,G.life))+"♡".repeat(Math.max(0,3-G.life));
  $("score").textContent=G.score.toLocaleString();
  const left=Math.max(0,Math.min(1,1-G.stageT/STAGE_SEC)); $("timefill").style.transform=`scaleX(${G.state==="play"?left:1})`;
  $("timefill").style.background=left<.25?"var(--warn)":"";
  const n=G.tiles.filter(Boolean).length; $("picLabel").textContent=`ST${Math.min(G.stage,7)+1}/8 ${DEPTS[Math.min(G.stage,7)].name} ${n}/${GRID*GRID}`;
  $("bits").innerHTML=G.bits.map(T=>`<span style="color:rgb(${T.rgb})">${T.bits}</span>`).join(" ")||"&nbsp;";
  const l=G.state!=="count"?satLook():null;
  $("sub").textContent = l ? `てんこう2：高度 ${Math.round(l.alt)}km・相模原から ${Math.round(l.rng).toLocaleString()}km・${dirName(l.az)}の空 ${Math.max(0,l.el).toFixed(0)}°` : (GP?"本物の軌道データで計算中":"");
  drawPic(pc,G.tiles,G.pf,Math.min(G.stage,7));
}

// ================== ループ・入力 ==================
let last=performance.now(); const keys={};
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==="pc"){ const sp=70*dt; if(keys.ArrowLeft) view.az-=sp; if(keys.ArrowRight) view.az+=sp; if(keys.ArrowUp) view.el=Math.min(85,view.el+sp); if(keys.ArrowDown) view.el=Math.max(-20,view.el-sp); }
  if(!G && mode===null) view.az+=dt*5;
  const B=getBasis(); update(dt,B); draw(B,now); updateHUD();
  requestAnimationFrame(frame);
}
addEventListener("keydown",e=>keys[e.key]=true); addEventListener("keyup",e=>keys[e.key]=false);
let drag=null;
cv.addEventListener("pointerdown",e=>{ if(mode!=="pc") return; drag={x:e.clientX,y:e.clientY,az:view.az,el:view.el}; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove",e=>{ if(!drag) return; const k=vfov/H*1.1; view.az=drag.az-(e.clientX-drag.x)*k; view.el=Math.max(-20,Math.min(85,drag.el+(e.clientY-drag.y)*k)); });
cv.addEventListener("pointerup",()=>drag=null);

let started=false;
function begin(){ $("start").style.display="none"; audio(); newGame(getBasis()); }
requestAnimationFrame(t=>{ last=t; frame(t); });

      const r=await DeviceOrientationEvent.requestPermission(); if(r!=="granted") throw new Error("傾きセンサーが許可されませんでした");

    mode="ar"; camOn=false; $("camBtn").style.display="block";

  }catch(err){ toast("カメラ／センサーを使えませんでした<br>（"+err.message+"）<br>SafariでHTTPSのページを開いてください",4500); }
}
$("bStartAR").onclick=startAR;

$("camBtn").onclick=async()=>{
  if(!camOn){ try{ if(!camStream){ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); $("video").srcObject=camStream; }
      $("video").style.display="block"; await $("video").play().catch(()=>{}); camOn=true; toast("カメラ映像に切り替え",1200); }

$("bStartPC").onclick=()=>{ mode="pc"; view={az:180,el:15}; begin(); toast("ドラッグ（または矢印キー）で見回そう",2500); };
